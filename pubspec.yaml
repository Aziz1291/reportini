name: reportini
description: Application citoyenne de signalement des problèmes urbains.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.1.2
  crypto: ^3.0.6
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_storage: ^13.0.6
  flutter_map: ^8.2.2
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  go_router: ^17.0.1
  google_fonts: ^6.3.2
  image_picker: ^1.2.0
  intl: ^0.20.3
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

    - assets/fonts/
